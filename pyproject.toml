[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-demand"
version = "1.0.0"
description = "Retail demand forecasting linked to inventory and capacity decisions: product x outlet intermittent demand, chain-scale store x family sales (Favorita) and hourly capacity planning"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Muneera Mohamed" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
extra = ["lightgbm>=4.0", "statsmodels>=0.14", "shap>=0.46"]
classical = ["statsmodels>=0.14", "prophet>=1.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 180
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
